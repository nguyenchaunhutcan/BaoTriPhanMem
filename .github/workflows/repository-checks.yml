name: Repository checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  repository:
    name: Structure and upstream baseline
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository and baseline tag
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check project structure and pristine baseline
        shell: pwsh
        run: ./scripts/check-repository.ps1
